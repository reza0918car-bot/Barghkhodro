name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
  uses: android-actions/setup-android@v3

- name: Install Android SDK packages
  run: |
    sdkmanager --install \
      "platform-tools" \
      "platforms;android-36" \
      "build-tools;36.0.0"

- name: Accept Android licenses
  run: yes | sdkmanager --licenses

      - name: Generate Android project files if missing
        shell: bash
        run: |
          if [[ ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ]]; then
            flutter create --platforms=android --org com.barghkhodro --project-name auto_electric_pro .
          fi

      - name: Install Android API 36 (locate sdkmanager reliably)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          echo "Android SDK root: $SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -d "$SDK_ROOT/cmdline-tools" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" && -x "$SDK_ROOT/tools/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo 'ERROR: sdkmanager was not found. Android command-line tools installation is missing.'
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Force and verify app compileSdk 36
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit('ERROR: android/app/build.gradle(.kts) not found')
          source = gradle.read_text()
          # Handles `compileSdk = flutter.compileSdkVersion`, `compileSdk flutter.compileSdkVersion`, and compileSdkVersion.
          pattern = re.compile(r'(?m)^(\s*)compileSdk(?:Version)?\s*(?:=\s*)?.*$')
          replacement = 'compileSdk = 36' if gradle.suffix == '.kts' else 'compileSdkVersion 36'
          updated, count = pattern.subn(lambda m: m.group(1) + replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'ERROR: Could not find compileSdk declaration in {gradle}')
          gradle.write_text(updated)
          print(f'Updated {gradle}: {replacement}')
          if not re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$', gradle.read_text()):
              raise SystemExit('ERROR: compileSdk 36 verification failed')
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bargh-khodro-mohandes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
