name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android & Apply Fixes
        run: |
          rm -rf android
          flutter create --platforms=android .
          
          sed -i 's/android:label="[^"]*"/android:label="برق خودرو مهندس"/g' android/app/src/main/AndroidManifest.xml
          
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
          fi
          if ! grep -q "android.permission.SEND_SMS" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.SEND_SMS"\/>' android/app/src/main/AndroidManifest.xml
          fi
          
          if [ -f "android/app/build.gradle.kts" ]; then
             sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/' android/app/build.gradle.kts
             sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
             sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

          # 👈 رفع مشکل Namespace به صورت تک‌خطی (بدون خطای قرمز در گیت‌هاب)
          if [ -f "android/build.gradle.kts" ]; then
             echo 'subprojects { plugins.withId("com.android.library") { extensions.configure<com.android.build.gradle.LibraryExtension>("android") { if (namespace == null) { namespace = project.group.toString() } } } }' >> android/build.gradle.kts
          elif [ -f "android/build.gradle" ]; then
             echo 'subprojects { plugins.withId("com.android.library") { if (android.namespace == null) { android.namespace = project.group } } }' >> android/build.gradle
          fi

      - name: Clean Dependencies and Cache
        run: |
          rm -f pubspec.lock
          flutter clean
          rm -rf ~/.gradle/caches
          flutter pub get
          flutter pub upgrade --major-versions

      - name: Build APK (with auto-retry)
        run: |
          success=0
          for i in 1 2 3; do
            echo "Build attempt $i of 3..."
            if flutter build apk --release; then
              success=1
              break
            fi
            echo "Build attempt $i failed, retrying in 30 seconds..."
            sleep 30
          done
          if [ $success -ne 1 ]; then
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: bargh-khodro-mohandes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
