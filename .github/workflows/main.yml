name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # مرحله هوشمند: بررسی کامل بودن پوشه اندروید و بازسازی در صورت نقص
      - name: Fix or Generate Android Files
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android files are missing or incomplete. Regenerating..."
            rm -rf android
            flutter create --platforms=android .
          fi
          chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bargh-khodro-mohandes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
