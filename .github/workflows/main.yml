name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files when missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.barghkhodro --project-name auto_electric_pro .
          fi

      - name: Install Android 36 SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Force app compileSdk to 36 and verify
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit('ERROR: Android app Gradle file was not generated/found')
          source = gradle.read_text()
          # Supports both Kotlin DSL and Groovy DSL, including Flutter variable values.
          pattern = re.compile(r'(?m)^(\s*)compileSdk(?:Version)?\s*(?:=\s*)?.*$')
          updated, count = pattern.subn(lambda m: m.group(1) + ('compileSdk = 36' if gradle.suffix == '.kts' else 'compileSdkVersion 36'), source, count=1)
          if count != 1:
              raise SystemExit('ERROR: Could not find compileSdk/compileSdkVersion in ' + str(gradle))
          gradle.write_text(updated)
          check = gradle.read_text()
          if not re.search(r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$', check):
              raise SystemExit('ERROR: compileSdk was not successfully set to 36')
          print('Verified compileSdk 36 in', gradle)
          print('--- Gradle SDK setting ---')
          for line in check.splitlines():
              if 'compileSdk' in line:
                  print(line)
          PYCODE

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bargh-khodro-mohandes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
