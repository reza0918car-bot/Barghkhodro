name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fix or Generate Android Files
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Android files missing. Regenerating..."
            rm -rf android
            flutter create --platforms=android .
          fi

          # ۱. تغییر نام برنامه به «برق خودرو مهندس»
          sed -i 's/android:label="[^"]*"/android:label="برق خودرو مهندس"/g' android/app/src/main/AndroidManifest.xml

          # ۲. اضافه کردن مجوز اینترنت برای دانلود و نمایش فونت فارسی
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
          fi

          # دانلود مستقیم گریدل از سرور پرسرعت کمکی برای دور زدن قطعی 504 گیت‌هاب
          WRAPPER_FILE="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_FILE" ]; then
            sed -i 's/-all.zip/-bin.zip/g' "$WRAPPER_FILE"
            GRADLE_ZIP=$(grep "distributionUrl" "$WRAPPER_FILE" | grep -o "gradle-.*\.zip" | head -n 1)
            echo "Target Gradle zip: $GRADLE_ZIP"

            if [ -n "$GRADLE_ZIP" ]; then
              echo "Downloading Gradle from fast mirror..."
              curl -fL --retry 5 "https://mirrors.cloud.tencent.com/gradle/$GRADLE_ZIP" -o "android/gradle/wrapper/$GRADLE_ZIP" || true

              if [ -f "android/gradle/wrapper/$GRADLE_ZIP" ]; then
                echo "Successfully downloaded. Switching to local Gradle distribution."
                sed -i "s|distributionUrl=.*|distributionUrl=$GRADLE_ZIP|" "$WRAPPER_FILE"
              fi
            fi
          fi

          chmod +x android/gradlew || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (with auto-retry)
        run: |
          success=0
          for i in 1 2 3; do
            echo "Build attempt $i of 3..."
            if flutter build apk --release; then
              success=1
              break
            fi
            echo "Build attempt $i failed, retrying in 15 seconds..."
            sleep 15
          done
          if [ $success -ne 1 ]; then
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bargh-khodro-mohandes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
