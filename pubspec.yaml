name: auto_electric_app
description: "نرم افزار مدیریت برق خودرو مهندس"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sms_sender_background: ^1.0.7
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  intl: any
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.1
  file_picker: ^13.3.1
  cross_file: ^0.3.5+5

dependency_overrides:
  win32: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Vazirmatn-Regular.ttf
    - assets/fonts/Vazirmatn-Bold.ttf
