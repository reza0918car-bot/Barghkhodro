name: auto_electric_app
description: "نرم افزار مدیریت برق خودرو مهندس"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  intl: any                      # ← سازگار با flutter_localizations
  pdf: ^3.11.1
  printing: ^5.13.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"   # ← فایل آیکون اپ‌تان را اینجا قرار دهید

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Vazirmatn-Regular.ttf
    - assets/fonts/Vazirmatn-Bold.ttf
